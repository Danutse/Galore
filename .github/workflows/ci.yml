name: Galore CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and dependencies
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Run source and dependency validation
        shell: powershell
        run: |
          $errors = @()
          $files = Get-ChildItem -Path . -Recurse -File -Filter *.ps1
          foreach($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            $errors += $parseErrors
          }
          if($errors.Count -gt 0) {
            $details = $errors | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            throw ("PowerShell syntax validation failed:`n" + ($details -join "`n"))
          }
          Write-Host "Parsed $($files.Count) PowerShell files successfully."

  compile-smoke:
    name: Compile disposable executable
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install compile dependency
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force
      - name: Compile-check the launcher
        shell: powershell
        run: |
          $output = Join-Path $env:TEMP "GaloreLauncher-CI.exe"
          ps2exe -inputFile .\Modules\GaloreLauncher.ps1 -outputFile $output -noConsole
          if(-not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw "ps2exe did not produce the disposable executable."
          }
