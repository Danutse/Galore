name: Galore CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Pester 4
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force
      - name: Run validation and unit tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Test-GaloreBuild.ps1

  compile-smoke:
    name: Compile disposable executable
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install test and compile dependencies
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Force
          Install-Module -Name ps2exe -Scope CurrentUser -Force
      - name: Compile-check the launcher
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Test-GaloreBuild.ps1 -Compile
