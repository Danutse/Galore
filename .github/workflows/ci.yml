name: Galore CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and dependencies
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Run source and dependency validation
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\Logs -Force | Out-Null
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Test-GaloreBuild.ps1 -SkipUnitTests

  compile-smoke:
    name: Compile disposable executable
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install compile dependency
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force
      - name: Compile-check the launcher
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path .\Logs -Force | Out-Null
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Test-GaloreBuild.ps1 -Compile -SkipUnitTests
